# Checks every PR and push. Deploys are NOT done here: Cloudflare Workers
# Builds (connected to this repo in the dashboard) runs `pnpm check` and
# `wrangler deploy` on pushes to main, so no Cloudflare API token lives in
# GitHub. See docs/operations.md. Content-only commits (content/**, e.g. the
# CMS -> git "[cms-sync]" commits) are handled by content-sync.yml.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["content/**"]
  pull_request:
    paths-ignore: ["content/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
