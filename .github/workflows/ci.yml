# Checks every PR and push; deploys main to Cloudflare Workers once the
# checks pass. Content-only commits (content/**, e.g. the CMS -> git
# "[cms-sync]" commits) are handled by content-sync.yml and need no deploy.
#
# Required repository secrets (production environment):
#   CLOUDFLARE_API_TOKEN   API token for `wrangler deploy` (see docs/operations.md)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["content/**"]
  pull_request:
    paths-ignore: ["content/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://inaridiy.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secret values live only in Cloudflare (wrangler secret put); the build
      # just needs the required names present.
      - run: pnpm build
        env:
          EMDASH_ENCRYPTION_KEY: build-only-placeholder
      - name: Deploy
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA::12} ${GITHUB_EVENT_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
