# git -> CMS content sync.
#
# The reverse direction (CMS -> git) is EVENT-DRIVEN: the github-sync
# plugin (plugins/github-sync) commits Markdown to this repo the moment an
# entry changes, with a "[cms-sync]" marker in the commit message. This
# workflow skips those commits (already in sync) and pushes every other
# content/** change to the CMS with the plugin's CLI. The manual pull job is
# a recovery tool, not a schedule.
#
# Required repository secrets:
#   EMDASH_URL    e.g. https://inari.diy
#   EMDASH_TOKEN  API token from the EmDash admin (content:read,
#                 content:write, schema:read). EMDASH_REFRESH_TOKEN (from
#                 `emdash login`, valid 90 days) still works as a fallback.
name: content-sync

on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync direction"
        type: choice
        options: [push, pull]
        default: push

permissions:
  contents: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  push-to-cms:
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[cms-sync]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:push
        env:
          EMDASH_URL: ${{ secrets.EMDASH_URL }}
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
          EMDASH_REFRESH_TOKEN: ${{ secrets.EMDASH_REFRESH_TOKEN }}
      - name: Commit CMS identity metadata
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No identity metadata changes"
          else
            git config user.name "content-sync[bot]"
            git config user.email "noreply@users.noreply.github.com"
            git commit -m "sync: persist CMS content identities [cms-sync]"
            git pull --rebase origin main
            git push
          fi

  pull-from-cms:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pull'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:pull
        env:
          EMDASH_URL: ${{ secrets.EMDASH_URL }}
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
          EMDASH_REFRESH_TOKEN: ${{ secrets.EMDASH_REFRESH_TOKEN }}
      - name: Commit CMS edits
        run: |
          git config user.name "content-sync[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No CMS changes"
          else
            git commit -m "sync: pull content edits from CMS [cms-sync]"
            git push
          fi
